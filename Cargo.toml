[workspace]
resolver = "3"
members = [
    "phobos-base",
    "phobos-bench",
    "phobos-cluster",
    "phobos-gguf",
    "phobos-inference",
    "phobos-lang",
    "phobos-mlir",
    "phobos-onnx",
    "phobos-pod",
    "phobos-sched",
]

[workspace.package]
edition = "2024"
readme = "README.md"
repository = "https://github.com/joa/phobos"
license = "Apache-2.0"
keywords = ["llvm", "mlir", "compiler", "gpu", "kernel"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
futures = "0.3"
sha2 = "0.10"
melior = "0.27.0"
mlir-sys = "220.0.2"
inkwell = { version = "0.9.0", default-features = false, features = ["llvm22-1", "target-nvptx"] }
llvm-sys = "221.0.1"

[patch.crates-io]
tblgen = { git = "https://github.com/joa/tblgen-rs.git" }
mlir-sys = { git = "https://github.com/joa/mlir-sys.git" }
melior = { git = "https://github.com/joa/melior.git" }
