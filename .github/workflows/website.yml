# Builds phobos-lang.dev and deploys it to GitHub Pages. Node only: every piece
# of site data that needs the compiler (traces, CLI help, the attribute list) is
# produced on a machine with the LLVM toolchain and committed under website/.

name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "SPEC.md"
      - "ENV.md"
      - "BENCHMARKS.md"
      - "WINDOWS.md"
      - "examples/**"
      - "phobos-lang/examples/*.ph"
      - "phobos-lang/src/token.rs"
      - "results/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
