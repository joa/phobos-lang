# Builds phobos-lang.dev and deploys it to GitHub Pages. Node only: every piece
# of site data that needs the compiler (traces, CLI help, the attribute list) is
# produced on a machine with the LLVM toolchain and committed under website/.

name: website

# No path filters: the site reads README, BENCHMARKS, SPEC, ENV, WINDOWS,
# python/README.md and the tutorials, the stdlib, the lexer's keywords, the
# quantized formats' sources, examples/ and results/, and its tests check them,
# so a filter would have to track every one of those to keep its word.
on:
  push:
    branches: [main]
  pull_request:
  # The footer names the latest release, read when the site builds.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event's ref is its tag; the site is always main's.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  # Only deploys share the Pages group, so a pull request's build never
  # cancels a deploy waiting in it.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
