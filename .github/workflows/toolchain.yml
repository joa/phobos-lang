# Builds the Linux LLVM/MLIR toolchain release.yml links against and attaches
# it to the toolchain-llvm-<version> release. A one-off per LLVM version:
# the Windows toolchain is packed from a local install by
# `python scripts/release.py toolchain`, which also creates that release.

name: toolchain

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: LLVM version to build
        default: "22.1.7"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LLVM_VERSION: ${{ inputs.llvm_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # An LLVM build tree outgrows the runner's free space; these are
      # preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build LLVM and MLIR on glibc 2.28
        run: |
          docker run --rm -e LLVM_VERSION -e WORK=/work/llvm -v "$PWD:/src" -v /mnt:/work -w /src \
            quay.io/pypa/manylinux_2_28_x86_64 bash scripts/ci/build_llvm.sh /src/out

      - name: Attach to the toolchain release
        run: gh release upload "toolchain-llvm-$LLVM_VERSION" "out/llvm-$LLVM_VERSION-linux-x64.tar.gz" --clobber
