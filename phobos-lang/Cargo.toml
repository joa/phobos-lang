[package]
name = "phobos-lang"
version = "0.2.0"
edition.workspace = true
description = "The Phobos kernel language"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["compilers", "development-tools"]

[dependencies]
anyhow = "1"
melior.workspace = true
phobos-base = { path = "../phobos-base" }
phobos-mlir = { path = "../phobos-mlir" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }

[features]
# The kernel visualizer's exporter, `src/trace`, and the `site` tool.
trace = ["dep:serde", "dep:serde_json", "dep:sha2"]

[[example]]
name = "site"
required-features = ["trace"]
