[package]
name = "phobos-bench"
version = "0.1.0"
edition.workspace = true
description = "Prompt and generation throughput of a GGUF model, as llama-bench reports it"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["development-tools"]

[[bin]]
name = "phobos-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
phobos-base = { path = "../phobos-base" }
phobos-gguf = { path = "../phobos-gguf" }
phobos-kernels = { path = "../phobos-kernels" }

[features]
cuda = ["phobos-gguf/cuda"]
